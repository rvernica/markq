[package]
name = "markq-test-support"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# Test-only fixtures shared by more than one crate's integration tests. Rust
# cannot share a `tests/` module across crates, and keeping a copy per crate let
# the copies drift apart, so the fixtures live in a crate instead.
[dependencies]
hex.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
